<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111622"/>
      <stop offset="50%" stop-color="#161e2e"/>
      <stop offset="100%" stop-color="#0c0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="160" r="140" fill="url(#glow)"/>
  
  <!-- Subtle geometric grid lines -->
  <line x1="60" y1="200" x2="340" y2="200" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="200" y1="60" x2="200" y2="340" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#334155" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 6"/>
  
  <!-- Stylized Executive Profile Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="48" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- Shoulders -->
  <path d="M120,290 C120,225 155,215 200,215 C245,215 280,225 280,290 L280,320 L120,320 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Initials Badge / Monogram -->
  <circle cx="200" cy="150" r="32" fill="#0f172a" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="200" y="157" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="20" fill="#93c5fd" letter-spacing="1">VKR</text>
  
  <!-- Collar Accent -->
  <path d="M185,215 L200,240 L215,215" fill="none" stroke="url(#accent)" stroke-width="2"/>
</svg>
